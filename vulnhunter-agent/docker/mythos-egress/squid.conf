# Mythos egress policy: CONNECT to the single Claude Platform on AWS endpoint.
# The correct hostname contains "us-east-1" (hyphens), not "us.east-1".
http_port 3128
visible_hostname mythos-egress
hosts_file /etc/hosts

acl CONNECT method CONNECT
acl TLS_port port 443
acl mythos_endpoint dstdomain aws-external-anthropic.us-east-1.api.aws

http_access deny !CONNECT
http_access deny !TLS_port
http_access allow mythos_endpoint
http_access deny all

cache deny all
cache_mem 0 MB
maximum_object_size 0 KB
pid_filename none
coredump_dir /tmp

# Record only the decision, destination host, and status for egress auditing.
# Never log query strings, headers, request bodies, or credentials.
logformat mythos_audit %ts.%03tu %>a %Ss/%03>Hs %rm %ru
access_log stdio:/dev/stdout mythos_audit
cache_log /dev/stderr
