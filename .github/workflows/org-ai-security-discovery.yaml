name: Org AI Security Discovery

on:
  workflow_dispatch:
    inputs:
      repos_csv:
        description: Path to CSV containing repositories to scan
        required: false
        default: config/repos.csv


  schedule:
    - cron: "30 7 * * 1"

permissions:
  contents: write
  pull-requests: write
  actions: read

env:
  GITHUB_API_URL: https://api.github.com
  GITHUB_WEB_URL: https://github.com
  REPORT_BRANCH_PREFIX: ai-security-triage

jobs:
  build-matrix:
    name: Build repository matrix
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - name: Checkout central repo
        uses: actions/checkout@v4

      - name: Build repository matrix from CSV
        id: matrix
        uses: ./.github/actions/build-repo-matrix
        with:
          repos-csv: ${{ inputs.repos_csv || 'config/repos.csv' }}

  scan-repositories:
    name: Scan ${{ matrix.owner }}/${{ matrix.repo }}
    runs-on: ubuntu-latest
    needs: build-matrix

    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include: ${{ fromJson(needs.build-matrix.outputs.matrix) }}

    steps:
      - name: Checkout central workflow repo
        uses: actions/checkout@v4
        with:
          path: ./
      
      - name: Run Claude agent security scan
        uses: ./.github/actions/claude-agent-sec-scan
        with:
          aws-workspace-id: ${{ secrets.ANTHROPIC_AWS_WORKSPACE_ID }}
          aws-api-key: ${{ secrets.ANTHROPIC_AWS_API_KEY }}
          scan-token: ${{ secrets.VULNHUNT_GITHUB_SCAN_TOKEN }}
          reports-token: ${{ secrets.VULNHUNT_GITHUB_REPORTS_TOKEN }}
          repository-url: "https://github.com/${{ matrix.owner }}/${{ matrix.repo }}"
          python-version: "3.12"
          working-directory: ./vulnhunter-agent

      - name: Upload repository report artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.repo }}
          path: vulnhunter-agent/clones/${{ matrix.repo }}
          retention-days: 30

  central-report-pr:
    name: Update central reports and open PR
    runs-on: ubuntu-latest
    needs:
      - scan-repositories

    steps:
      - name: Checkout central repo
        uses: actions/checkout@v4
        with:
          path: central-repo
          token: ${{ secrets.ORG_SECURITY_TOKEN }}

      - name: Download repository report artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-reports

      - name: Update org_findings.csv and reports directory
        uses: ./.github/actions/gh-update-org-findings
        with:
          central-repo-path: central-repo
          downloaded-reports-path: downloaded-reports
          org-findings-file: org_findings.csv
          reports-directory: reports

      - name: Upload org_findings artifact
        uses: actions/upload-artifact@v4
        with:
          name: org_findings
          path: org_findings.csv
          retention-days: 30

      - name: Create central reporting PR
        uses: ./.github/actions/gh-create-central-report-pr
        with:
          token: ${{ secrets.ORG_SECURITY_TOKEN }}
          central-repo-path: central-repo
          branch-prefix: ${{ env.REPORT_BRANCH_PREFIX }}
          commit-message: Update AI security triage reports
          pr-title: Update AI security triage reports
          pr-body: |
            This PR updates repository-level AI security triage reports, exported GitHub security alert JSON files, generated SARIF files, mitigation reports, and the org_findings.csv rollup.
