name: Org AI Security Discovery

on:
  workflow_dispatch:
    inputs:
      repos_csv:
        description: Path to CSV containing repositories to scan
        required: false
        default: config/repos.csv
      github_auth_method:
        description: How to obtain the scan and reports GitHub tokens
        required: false
        type: choice
        default: pat
        options:
          - pat
          - github_app
      anthropic_auth_method:
        description: How the agent authenticates to Claude (aws_role is unsupported for claude-mythos-5)
        required: false
        type: choice
        default: api_key
        options:
          - api_key
          - aws_role
      model:
        description: Claude model execution profile
        required: true
        type: choice
        default: claude-opus-4-8
        options:
          - claude-opus-4-7
          - claude-opus-4-8
          - claude-mythos-5
      mythos_retention_acknowledged:
        description: Acknowledge mandatory 30-day Mythos request retention (no ZDR)
        required: false
        type: boolean
        default: false
      publish_results:
        description: Publish reports to the central repository
        required: false
        type: boolean
        default: true
      submit_repo_issues:
        description: Create or update findings issues in scanned repositories
        required: false
        type: boolean
        default: true


  schedule:
    - cron: "30 7 * * 1"

permissions:
  contents: read
  actions: read
  id-token: write  # for anthropic_auth_method=aws_role (aws-actions/configure-aws-credentials OIDC)

env:
  GITHUB_API_URL: https://api.github.com
  GITHUB_WEB_URL: https://github.com
  REPORT_BRANCH_PREFIX: ai-security-triage

jobs:
  build-matrix:
    name: Build repository matrix
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - name: Checkout central repo
        uses: actions/checkout@v4

      - name: Build repository matrix from CSV
        id: matrix
        uses: ./.github/actions/build-repo-matrix
        with:
          repos-csv: ${{ inputs.repos_csv || 'config/repos.csv' }}

  scan-repositories:
    name: Scan ${{ matrix.owner }}/${{ matrix.repo }}@${{ matrix.default_branch }}
    # Mythos fails closed onto an ephemeral/self-hosted Linux runner that has
    # Docker's runsc runtime. Use an ARC runner scale set named `gvisor` for
    # horizontal scaling. Scheduled runs default to Opus on ubuntu-latest.
    runs-on: ${{ (inputs.model == 'claude-mythos-5') && 'gvisor' || 'ubuntu-latest' }}
    needs: build-matrix

    env:
      # Same schedule-vs-dispatch fallback shape as publish_results/submit_repo_issues
      # below: workflow_dispatch reads the input directly, scheduled runs fall back to
      # a protected repository variable (or 'pat' if that variable is unset).
      RESOLVED_AUTH_METHOD: ${{ (github.event_name == 'workflow_dispatch' && inputs.github_auth_method) || (github.event_name != 'workflow_dispatch' && (vars.VULNHUNT_GITHUB_AUTH_METHOD || 'pat')) }}
      # Same schedule-vs-dispatch fallback shape as RESOLVED_AUTH_METHOD above:
      # workflow_dispatch reads the input directly, scheduled runs fall back to
      # a repository/organization variable (or 'api_key' if that variable is unset).
      RESOLVED_ANTHROPIC_AUTH_METHOD: ${{ (github.event_name == 'workflow_dispatch' && inputs.anthropic_auth_method) || (github.event_name != 'workflow_dispatch' && (vars.VULNHUNT_ANTHROPIC_AUTH_METHOD || 'api_key')) }}

    strategy:
      fail-fast: false
      max-parallel: 30
      matrix:
        include: ${{ fromJson(needs.build-matrix.outputs.matrix) }}

    steps:
      - name: Checkout central workflow repo
        uses: actions/checkout@v4
        with:
          path: ./

      - name: Validate GitHub authentication inputs
        shell: bash
        env:
          AUTH_METHOD: ${{ env.RESOLVED_AUTH_METHOD }}
          APP_ID: ${{ secrets.VULNHUNT_GITHUB_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.VULNHUNT_GITHUB_APP_PRIVATE_KEY }}
          PAT_SCAN: ${{ secrets.VULNHUNT_GITHUB_SCAN_TOKEN }}
          PAT_REPORTS: ${{ secrets.VULNHUNT_GITHUB_REPORTS_TOKEN }}
        run: |
          set -euo pipefail
          case "${AUTH_METHOD}" in
            pat)
              [[ -n "${PAT_SCAN}" && -n "${PAT_REPORTS}" ]] || {
                echo "::error::github_auth_method=pat requires the VULNHUNT_GITHUB_SCAN_TOKEN and VULNHUNT_GITHUB_REPORTS_TOKEN secrets."
                exit 1
              }
              ;;
            github_app)
              [[ -n "${APP_ID}" && -n "${APP_PRIVATE_KEY}" ]] || {
                echo "::error::github_auth_method=github_app requires the VULNHUNT_GITHUB_APP_ID and VULNHUNT_GITHUB_APP_PRIVATE_KEY secrets."
                exit 1
              }
              ;;
            *)
              echo "::error::Unsupported github_auth_method '${AUTH_METHOD}'; use 'pat' or 'github_app'."
              exit 1
              ;;
          esac

      - name: Validate Anthropic authentication inputs
        shell: bash
        env:
          AUTH_METHOD: ${{ env.RESOLVED_ANTHROPIC_AUTH_METHOD }}
          WORKSPACE_ID: ${{ secrets.ANTHROPIC_AWS_WORKSPACE_ID }}
          API_KEY: ${{ secrets.ANTHROPIC_AWS_API_KEY }}
          ROLE_ARN: ${{ secrets.ANTHROPIC_AWS_ROLE_ARN }}
        run: |
          set -euo pipefail
          case "${AUTH_METHOD}" in
            api_key)
              [[ -n "${WORKSPACE_ID}" && -n "${API_KEY}" ]] || {
                echo "::error::anthropic_auth_method=api_key requires the ANTHROPIC_AWS_WORKSPACE_ID and ANTHROPIC_AWS_API_KEY secrets."
                exit 1
              }
              ;;
            aws_role)
              [[ -n "${ROLE_ARN}" ]] || {
                echo "::error::anthropic_auth_method=aws_role requires the ANTHROPIC_AWS_ROLE_ARN secret."
                exit 1
              }
              ;;
            *)
              echo "::error::Unsupported anthropic_auth_method '${AUTH_METHOD}'; use 'api_key' or 'aws_role'."
              exit 1
              ;;
          esac

      - name: Assume AWS role for Claude on Bedrock
        if: env.RESOLVED_ANTHROPIC_AUTH_METHOD == 'aws_role'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ANTHROPIC_AWS_ROLE_ARN }}
          aws-region: ${{ vars.VULNHUNT_ANTHROPIC_AWS_REGION || 'us-east-1' }}

      - name: Resolve GitHub App token scopes
        id: app-scope
        if: env.RESOLVED_AUTH_METHOD == 'github_app'
        shell: bash
        env:
          REPORTS_REPOSITORY_URL: ${{ vars.VULNHUNT_REPORTS_REPOSITORY || format('{0}/{1}', github.server_url, github.repository) }}
        run: |
          set -euo pipefail
          # REPORTS_REPOSITORY_URL is scheme://host/owner/repo; strip scheme and host.
          without_scheme="${REPORTS_REPOSITORY_URL#*://}"
          path="${without_scheme#*/}"
          {
            echo "reports-owner=${path%%/*}"
            echo "reports-repo=${path#*/}"
          } >> "${GITHUB_OUTPUT}"

      - name: Mint scan-scoped GitHub App installation token
        id: mint-scan-token
        if: env.RESOLVED_AUTH_METHOD == 'github_app'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.VULNHUNT_GITHUB_APP_ID }}
          private-key: ${{ secrets.VULNHUNT_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ matrix.owner }}
          repositories: ${{ matrix.repo }}

      - name: Mint reports-scoped GitHub App installation token
        id: mint-reports-token
        if: env.RESOLVED_AUTH_METHOD == 'github_app'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.VULNHUNT_GITHUB_APP_ID }}
          private-key: ${{ secrets.VULNHUNT_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ steps.app-scope.outputs.reports-owner }}
          repositories: ${{ steps.app-scope.outputs.reports-repo }}

      - name: Run Opus Claude agent security scan
        if: ${{ (inputs.model || 'claude-opus-4-8') != 'claude-mythos-5' }}
        uses: ./.github/actions/claude-agent-sec-scan
        with:
          anthropic-auth-mode: ${{ env.RESOLVED_ANTHROPIC_AUTH_METHOD }}
          aws-workspace-id: ${{ secrets.ANTHROPIC_AWS_WORKSPACE_ID }}
          aws-api-key: ${{ secrets.ANTHROPIC_AWS_API_KEY }}
          aws-region: ${{ vars.VULNHUNT_ANTHROPIC_AWS_REGION || 'us-east-1' }}
          scan-token: ${{ env.RESOLVED_AUTH_METHOD == 'github_app' && steps.mint-scan-token.outputs.token || secrets.VULNHUNT_GITHUB_SCAN_TOKEN }}
          reports-token: ${{ env.RESOLVED_AUTH_METHOD == 'github_app' && steps.mint-reports-token.outputs.token || secrets.VULNHUNT_GITHUB_REPORTS_TOKEN }}
          publish-results: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish_results) || (github.event_name != 'workflow_dispatch' && vars.VULNHUNT_PUBLISH_RESULTS != 'false') }}
          submit-repo-issues: ${{ (github.event_name == 'workflow_dispatch' && inputs.submit_repo_issues) || (github.event_name != 'workflow_dispatch' && vars.VULNHUNT_SUBMIT_REPO_ISSUES != 'false') }}
          reports-repository-url: ${{ vars.VULNHUNT_REPORTS_REPOSITORY || format('{0}/{1}', github.server_url, github.repository) }}
          reports-branch: ${{ vars.VULNHUNT_REPORTS_BRANCH || 'main' }}
          model: ${{ inputs.model || 'claude-opus-4-8' }}
          repository-url: "https://github.com/${{ matrix.owner }}/${{ matrix.repo }}"
          repository-branch: ${{ matrix.default_branch }}
          python-version: "3.12"
          working-directory: ./vulnhunter-agent

      - name: Run isolated Mythos security scan
        if: ${{ inputs.model == 'claude-mythos-5' }}
        uses: ./.github/actions/claude-agent-sec-scan
        with:
          anthropic-auth-mode: ${{ env.RESOLVED_ANTHROPIC_AUTH_METHOD }}
          aws-workspace-id: ${{ secrets.ANTHROPIC_AWS_WORKSPACE_ID }}
          aws-api-key: ${{ secrets.ANTHROPIC_AWS_API_KEY }}
          aws-region: ${{ vars.VULNHUNT_ANTHROPIC_AWS_REGION || 'us-east-1' }}
          scan-token: ${{ env.RESOLVED_AUTH_METHOD == 'github_app' && steps.mint-scan-token.outputs.token || secrets.VULNHUNT_GITHUB_SCAN_TOKEN }}
          reports-token: ${{ env.RESOLVED_AUTH_METHOD == 'github_app' && steps.mint-reports-token.outputs.token || secrets.VULNHUNT_GITHUB_REPORTS_TOKEN }}
          # The scan/reports tokens above are minted at job start (see the mint
          # steps earlier in this job) and can expire (GitHub App installation
          # tokens are hard-capped at 1 hour) before "Deliver Mythos results"
          # runs, since the gVisor scan step in between can take hours. Passing
          # the App credentials through lets the composite action re-mint fresh
          # ones immediately before delivery instead of reusing stale tokens.
          github-auth-method: ${{ env.RESOLVED_AUTH_METHOD }}
          app-id: ${{ secrets.VULNHUNT_GITHUB_APP_ID }}
          app-private-key: ${{ secrets.VULNHUNT_GITHUB_APP_PRIVATE_KEY }}
          publish-results: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish_results) || (github.event_name != 'workflow_dispatch' && vars.VULNHUNT_PUBLISH_RESULTS != 'false') }}
          submit-repo-issues: ${{ (github.event_name == 'workflow_dispatch' && inputs.submit_repo_issues) || (github.event_name != 'workflow_dispatch' && vars.VULNHUNT_SUBMIT_REPO_ISSUES != 'false') }}
          reports-repository-url: ${{ vars.VULNHUNT_REPORTS_REPOSITORY || format('{0}/{1}', github.server_url, github.repository) }}
          reports-branch: ${{ vars.VULNHUNT_REPORTS_BRANCH || 'main' }}
          model: claude-mythos-5
          mythos-retention-acknowledged: ${{ inputs.mythos_retention_acknowledged }}
          repository-url: "https://github.com/${{ matrix.owner }}/${{ matrix.repo }}"
          repository-branch: ${{ matrix.default_branch }}
          python-version: "3.12"
          working-directory: ./vulnhunter-agent

      - name: Upload repository report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.repo }}
          path: vulnhunter-agent/clones/${{ matrix.repo }}
          retention-days: 30
