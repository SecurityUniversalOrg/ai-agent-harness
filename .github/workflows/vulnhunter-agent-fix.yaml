name: VulnHunter Agent Fix

on:
  workflow_dispatch:
    inputs:
      target_repository:
        description: Target repository in owner/name form
        required: true
        type: string
      reports_repository:
        description: Repository containing the selected VulnHunter report
        required: true
        type: string
      reports_ref:
        description: Branch, tag, or commit containing the selected report
        required: false
        default: main
        type: string
      results_path:
        description: Exact *_VULNHUNT_RESULTS_* directory in the reports repository
        required: true
        type: string
      github_auth_method:
        description: How to obtain the fix and reports GitHub tokens
        required: false
        default: pat
        type: choice
        options:
          - pat
          - github_app
      anthropic_auth_method:
        description: How the agent authenticates to Claude (aws_role is unsupported for claude-mythos-5)
        required: false
        default: api_key
        type: choice
        options:
          - api_key
          - aws_role
      model:
        description: Reviewed remediation model, or 'auto' to let remediation_model/report severity pick per run
        required: true
        default: claude-opus-4-8
        type: choice
        options:
          - claude-opus-4-7
          - claude-opus-4-8
          - claude-mythos-5
          - auto
      remediation_model:
        description: Cheaper model used when model=auto and report severity doesn't require escalation (blank disables tiering)
        required: false
        default: ""
        type: string
      remediation_escalate_severities:
        description: Comma-separated report severities that force the escalated model even under model=auto
        required: false
        default: "High+"
        type: string
      mythos_retention_acknowledged:
        description: Acknowledge mandatory 30-day Mythos request retention (no ZDR); ignored for Opus models
        required: false
        default: false
        type: boolean
      delivery_enabled:
        description: Permit private-fork issues and PR delivery
        required: false
        default: false
        type: boolean
      test_policy:
        description: Regression-suite policy
        required: true
        default: best-effort
        type: choice
        options:
          - best-effort
          - must-pass
          - skip
      artifact_retention_days:
        description: Sensitive remediation artifact retention
        required: false
        default: 14
        type: number
      timeout_minutes:
        description: Job timeout
        required: false
        default: 180
        type: number
  workflow_call:
    inputs:
      target_repository:
        required: true
        type: string
      reports_repository:
        required: true
        type: string
      reports_ref:
        required: false
        default: main
        type: string
      results_path:
        required: true
        type: string
      github_auth_method:
        required: false
        default: pat
        type: string
      anthropic_auth_method:
        required: false
        default: api_key
        type: string
      model:
        required: false
        default: claude-opus-4-8
        type: string
      remediation_model:
        required: false
        default: ""
        type: string
      remediation_escalate_severities:
        required: false
        default: "High+"
        type: string
      mythos_retention_acknowledged:
        required: false
        default: false
        type: boolean
      delivery_enabled:
        required: false
        default: false
        type: boolean
      test_policy:
        required: false
        default: best-effort
        type: string
      artifact_retention_days:
        required: false
        default: 14
        type: number
      timeout_minutes:
        required: false
        default: 180
        type: number
    outputs:
      run_status:
        description: Validated fix disposition status.
        value: ${{ jobs.fix.outputs.run-status }}
      findings_count:
        description: Number of findings in the disposition.
        value: ${{ jobs.fix.outputs.findings-count }}
    secrets:
      # Exactly one credential source is required, gated by the
      # anthropic_auth_method input: the API-key pair when 'api_key' (the
      # default), or ANTHROPIC_AWS_ROLE_ARN when 'aws_role'. Neither can be
      # declared required: true here — GitHub Actions can't express "required
      # unless X" — so the "Validate Anthropic authentication inputs" step
      # enforces it at runtime instead.
      ANTHROPIC_AWS_WORKSPACE_ID:
        required: false
      ANTHROPIC_AWS_API_KEY:
        required: false
      ANTHROPIC_AWS_ROLE_ARN:
        required: false
      # Exactly one credential source is required, gated by the github_auth_method input:
      # the PAT pair when 'pat' (the default), or the GitHub App pair when
      # 'github_app'. Neither can be declared required: true here — GitHub
      # Actions can't express "required unless X" — so the "Validate GitHub
      # authentication inputs" step enforces it at runtime instead.
      VULNHUNT_GITHUB_FIX_TOKEN:
        required: false
      VULNHUNT_GITHUB_REPORTS_TOKEN:
        required: false
      VULNHUNT_GITHUB_APP_ID:
        required: false
      VULNHUNT_GITHUB_APP_PRIVATE_KEY:
        required: false

permissions:
  contents: read
  actions: read
  id-token: write  # for anthropic_auth_method=aws_role (aws-actions/configure-aws-credentials OIDC)

concurrency:
  group: vulnhunter-fix-${{ inputs.target_repository }}
  cancel-in-progress: false

jobs:
  fix:
    name: Fix ${{ inputs.target_repository }}
    # Mythos fails closed onto an ephemeral/self-hosted Linux runner that has
    # Docker's runsc runtime — see scripts/run_mythos_fix_sandbox.sh, which
    # requires it to build and launch the gVisor-isolated agent container.
    # Opus runs on an ordinary runner, unchanged.
    runs-on: ${{ (inputs.model == 'claude-mythos-5') && (vars.VULNHUNT_FIX_GVISOR_RUNNER || 'gvisor') || (vars.VULNHUNT_FIX_RUNNER || 'ubuntu-latest') }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    environment: vulnhunter-fix
    outputs:
      run-status: ${{ steps.attest.outputs.run-status }}
      findings-count: ${{ steps.attest.outputs.findings-count }}

    steps:
      - name: Enforce trusted same-repository workflow invocation
        if: ${{ !startsWith(github.workflow_ref, format('{0}/', github.repository)) }}
        shell: bash
        run: |
          echo "Cross-repository workflow_call is not supported because this workflow executes local composite actions." >&2
          exit 64

      - name: Checkout trusted workflow repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Validate GitHub authentication inputs
        shell: bash
        env:
          AUTH_METHOD: ${{ inputs.github_auth_method }}
          APP_ID: ${{ secrets.VULNHUNT_GITHUB_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.VULNHUNT_GITHUB_APP_PRIVATE_KEY }}
          PAT_FIX: ${{ secrets.VULNHUNT_GITHUB_FIX_TOKEN }}
          PAT_REPORTS: ${{ secrets.VULNHUNT_GITHUB_REPORTS_TOKEN }}
        run: |
          set -euo pipefail
          case "${AUTH_METHOD}" in
            pat)
              [[ -n "${PAT_FIX}" && -n "${PAT_REPORTS}" ]] || {
                echo "::error::github_auth_method=pat requires the VULNHUNT_GITHUB_FIX_TOKEN and VULNHUNT_GITHUB_REPORTS_TOKEN secrets."
                exit 1
              }
              ;;
            github_app)
              [[ -n "${APP_ID}" && -n "${APP_PRIVATE_KEY}" ]] || {
                echo "::error::github_auth_method=github_app requires the VULNHUNT_GITHUB_APP_ID and VULNHUNT_GITHUB_APP_PRIVATE_KEY secrets."
                exit 1
              }
              ;;
            *)
              echo "::error::Unsupported github_auth_method '${AUTH_METHOD}'; use 'pat' or 'github_app'."
              exit 1
              ;;
          esac

      - name: Validate Anthropic authentication inputs
        shell: bash
        env:
          AUTH_METHOD: ${{ inputs.anthropic_auth_method }}
          WORKSPACE_ID: ${{ secrets.ANTHROPIC_AWS_WORKSPACE_ID }}
          API_KEY: ${{ secrets.ANTHROPIC_AWS_API_KEY }}
          ROLE_ARN: ${{ secrets.ANTHROPIC_AWS_ROLE_ARN }}
        run: |
          set -euo pipefail
          case "${AUTH_METHOD}" in
            api_key)
              [[ -n "${WORKSPACE_ID}" && -n "${API_KEY}" ]] || {
                echo "::error::anthropic_auth_method=api_key requires the ANTHROPIC_AWS_WORKSPACE_ID and ANTHROPIC_AWS_API_KEY secrets."
                exit 1
              }
              ;;
            aws_role)
              [[ -n "${ROLE_ARN}" ]] || {
                echo "::error::anthropic_auth_method=aws_role requires the ANTHROPIC_AWS_ROLE_ARN secret."
                exit 1
              }
              ;;
            *)
              echo "::error::Unsupported anthropic_auth_method '${AUTH_METHOD}'; use 'api_key' or 'aws_role'."
              exit 1
              ;;
          esac

      - name: Assume AWS role for Claude on Bedrock
        if: inputs.anthropic_auth_method == 'aws_role'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ANTHROPIC_AWS_ROLE_ARN }}
          aws-region: ${{ vars.VULNHUNT_ANTHROPIC_AWS_REGION || 'us-east-1' }}

      - name: Resolve GitHub App token scopes
        id: app-scope
        if: inputs.github_auth_method == 'github_app'
        shell: bash
        env:
          TARGET_REPOSITORY: ${{ inputs.target_repository }}
          REPORTS_REPOSITORY: ${{ inputs.reports_repository }}
        run: |
          set -euo pipefail
          {
            echo "target-owner=${TARGET_REPOSITORY%%/*}"
            echo "target-repo=${TARGET_REPOSITORY#*/}"
            echo "reports-owner=${REPORTS_REPOSITORY%%/*}"
            echo "reports-repo=${REPORTS_REPOSITORY#*/}"
          } >> "${GITHUB_OUTPUT}"

      - name: Mint fix-scoped GitHub App installation token
        id: mint-fix-token
        if: inputs.github_auth_method == 'github_app'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.VULNHUNT_GITHUB_APP_ID }}
          private-key: ${{ secrets.VULNHUNT_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ steps.app-scope.outputs.target-owner }}
          repositories: ${{ steps.app-scope.outputs.target-repo }}

      - name: Mint reports-scoped GitHub App installation token
        id: mint-reports-token
        if: inputs.github_auth_method == 'github_app'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.VULNHUNT_GITHUB_APP_ID }}
          private-key: ${{ secrets.VULNHUNT_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ steps.app-scope.outputs.reports-owner }}
          repositories: ${{ steps.app-scope.outputs.reports-repo }}

      - name: Set up VulnHunter agent
        id: setup
        uses: ./.github/actions/setup-vulnhunter-agent
        with:
          python-version: "3.12"
          working-directory: vulnhunter-agent
          config-path: vulnhunter-agent/agent/config.example.toml
          install-skills: "true"

      - name: Validate policy and stage exact report
        id: prepare
        uses: ./.github/actions/prepare-vulnhunter-fix
        with:
          target-repository: ${{ inputs.target_repository }}
          reports-repository: ${{ inputs.reports_repository }}
          reports-ref: ${{ inputs.reports_ref }}
          results-path: ${{ inputs.results_path }}
          reports-token: ${{ inputs.github_auth_method == 'github_app' && steps.mint-reports-token.outputs.token || secrets.VULNHUNT_GITHUB_REPORTS_TOKEN }}
          model: ${{ inputs.model }}
          mythos-retention-acknowledged: ${{ inputs.mythos_retention_acknowledged }}
          anthropic-auth-mode: ${{ inputs.anthropic_auth_method }}
          delivery-enabled: ${{ inputs.delivery_enabled }}
          test-policy: ${{ inputs.test_policy }}
          allowed-domains: ${{ vars.VULNHUNT_FIX_ALLOWED_DOMAINS }}
          fork-org: ${{ vars.VULNHUNT_FIX_FORK_ORG }}
          github-server-url: ${{ github.server_url }}

      - name: Validate and attest Mythos gVisor isolation
        id: mythos-proof
        if: inputs.model == 'claude-mythos-5'
        shell: bash
        env:
          # Credential-free canary: proves the same runsc/read-only/tmpfs-only/
          # single-host-egress boundaries the real run will use, before any
          # model or GitHub credential is involved. See claude-agent-sec-scan
          # for the identical scan-mode step this mirrors.
          MYTHOS_REPO_ROOT: ${{ github.workspace }}
          MYTHOS_DOCKER_RUNTIME: runsc
        run: |
          set -euo pipefail
          chmod +x scripts/validate_mythos_isolation.sh
          proof_log="${RUNNER_TEMP}/mythos-fix-isolation-proof-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.log"
          scripts/validate_mythos_isolation.sh | tee "${proof_log}"
          {
            echo "### Mythos gVisor isolation proof (fix)"
            echo
            echo '```text'
            grep '^ISOLATION_PROOF ' "${proof_log}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
          rm -f -- "${proof_log}"

      - name: Run automated fix
        id: fix
        continue-on-error: true
        uses: ./.github/actions/run-vulnhunter-fix
        with:
          python-path: ${{ steps.setup.outputs.python-path }}
          config-path: ${{ steps.setup.outputs.config-path }}
          github-host: ${{ steps.prepare.outputs.github-host }}
          target-url: ${{ steps.prepare.outputs.target-url }}
          report-directory: ${{ steps.prepare.outputs.report-directory }}
          scratch-base: ${{ steps.prepare.outputs.scratch-base }}
          model: ${{ inputs.model }}
          remediation-model: ${{ inputs.remediation_model }}
          remediation-escalate-severities: ${{ inputs.remediation_escalate_severities }}
          mythos-retention-acknowledged: ${{ inputs.mythos_retention_acknowledged }}
          anthropic-auth-mode: ${{ inputs.anthropic_auth_method }}
          aws-workspace-id: ${{ secrets.ANTHROPIC_AWS_WORKSPACE_ID }}
          aws-api-key: ${{ secrets.ANTHROPIC_AWS_API_KEY }}
          aws-region: ${{ vars.VULNHUNT_ANTHROPIC_AWS_REGION || 'us-east-1' }}
          fix-token: ${{ inputs.github_auth_method == 'github_app' && steps.mint-fix-token.outputs.token || secrets.VULNHUNT_GITHUB_FIX_TOKEN }}
          delivery-enabled: ${{ inputs.delivery_enabled }}
          test-policy: ${{ inputs.test_policy }}
          fork-org: ${{ vars.VULNHUNT_FIX_FORK_ORG }}
          allowed-domains: ${{ vars.VULNHUNT_FIX_ALLOWED_DOMAINS }}

      - name: Attest fix disposition
        id: attest
        if: always() && steps.fix.outputs.run-directory != ''
        continue-on-error: true
        uses: ./.github/actions/attest-vulnhunter-fix
        with:
          python-path: ${{ steps.setup.outputs.python-path }}
          run-directory: ${{ steps.fix.outputs.run-directory }}
          disposition-path: ${{ steps.fix.outputs.disposition-path }}
          agent-exit-code: ${{ steps.fix.outputs.agent-exit-code }}
          target-url: ${{ steps.prepare.outputs.target-url }}
          report-directory: ${{ steps.prepare.outputs.report-directory }}
          delivery-enabled: ${{ inputs.delivery_enabled }}

      - name: Package curated fix evidence
        id: package
        if: always()
        continue-on-error: true
        uses: ./.github/actions/package-vulnhunter-run
        with:
          mode: fix
          run-directory: ${{ steps.fix.outputs.run-directory }}
          agent-exit-code: ${{ steps.fix.outputs.agent-exit-code || 'not-started' }}

      - name: Upload sensitive fix evidence
        id: upload
        if: always() && steps.package.outputs.package-directory != ''
        uses: actions/upload-artifact@v4
        with:
          name: vulnhunter-fix-${{ steps.prepare.outputs.target-key || github.run_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.package.outputs.package-directory }}
          if-no-files-found: error
          include-hidden-files: false
          retention-days: ${{ inputs.artifact_retention_days }}

      - name: Enforce fix workflow outcome
        if: always()
        shell: bash
        env:
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
          PREPARE_OUTCOME: ${{ steps.prepare.outcome }}
          MYTHOS_PROOF_OUTCOME: ${{ steps.mythos-proof.outcome }}
          FIX_OUTCOME: ${{ steps.fix.outcome }}
          ATTEST_OUTCOME: ${{ steps.attest.outcome }}
          PACKAGE_OUTCOME: ${{ steps.package.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        run: |
          set -euo pipefail
          for outcome in "${SETUP_OUTCOME}" "${PREPARE_OUTCOME}" "${FIX_OUTCOME}" "${ATTEST_OUTCOME}" "${PACKAGE_OUTCOME}" "${UPLOAD_OUTCOME}"; do
            [[ "${outcome}" == "success" ]] || {
              echo "::error::VulnHunter fix did not complete every trusted workflow stage."
              exit 1
            }
          done
          # mythos-proof only runs for claude-mythos-5 (if: inputs.model ==
          # 'claude-mythos-5'); "skipped" is the correct, expected outcome for
          # every Opus run. Anything else (failure/cancelled) is fatal.
          [[ "${MYTHOS_PROOF_OUTCOME}" == "success" || "${MYTHOS_PROOF_OUTCOME}" == "skipped" ]] || {
            echo "::error::Mythos gVisor isolation proof did not pass."
            exit 1
          }
