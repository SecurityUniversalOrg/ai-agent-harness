name: VulnHunter Agent Verify

on:
  workflow_dispatch:
    inputs:
      issue_urls_json:
        description: JSON array of one or more closed VulnHunter issue URLs
        required: true
        type: string
      expected_repository:
        description: Required owner/name target repository scope
        required: true
        type: string
      reports_repository:
        description: Central reports repository in owner/name form
        required: true
        type: string
      reports_branch:
        description: Central reports branch
        required: false
        default: main
        type: string
      github_auth_method:
        description: How to obtain the verify and reports GitHub tokens
        required: false
        default: pat
        type: choice
        options:
          - pat
          - github_app
      commit:
        description: Optional target commit SHA
        required: false
        default: ""
        type: string
      model:
        description: Reviewed verification model
        required: true
        default: claude-opus-4-8
        type: choice
        options:
          - claude-opus-4-7
          - claude-opus-4-8
          - claude-mythos-5
      mythos_retention_acknowledged:
        description: Acknowledge mandatory 30-day Mythos request retention (no ZDR); ignored for Opus models
        required: false
        default: false
        type: boolean
      post_comments:
        description: Post validated verdict comments
        required: false
        default: false
        type: boolean
      reopen_nonfixed:
        description: Reopen non-fixed findings; requires post_comments
        required: false
        default: false
        type: boolean
      artifact_retention_days:
        description: Sensitive verification artifact retention
        required: false
        default: 14
        type: number
      timeout_minutes:
        description: Job timeout
        required: false
        default: 120
        type: number
  workflow_call:
    inputs:
      issue_urls_json:
        required: true
        type: string
      expected_repository:
        required: true
        type: string
      reports_repository:
        required: true
        type: string
      reports_branch:
        required: false
        default: main
        type: string
      github_auth_method:
        required: false
        default: pat
        type: string
      commit:
        required: false
        default: ""
        type: string
      model:
        required: false
        default: claude-opus-4-8
        type: string
      mythos_retention_acknowledged:
        required: false
        default: false
        type: boolean
      post_comments:
        required: false
        default: false
        type: boolean
      reopen_nonfixed:
        required: false
        default: false
        type: boolean
      artifact_retention_days:
        required: false
        default: 14
        type: number
      timeout_minutes:
        required: false
        default: 120
        type: number
    outputs:
      disposition_count:
        value: ${{ jobs.verify.outputs.disposition-count }}
      verdict_counts_json:
        value: ${{ jobs.verify.outputs.verdict-counts-json }}
    secrets:
      ANTHROPIC_AWS_WORKSPACE_ID:
        required: true
      ANTHROPIC_AWS_API_KEY:
        required: true
      # Exactly one credential source is required, gated by the github_auth_method input:
      # the PAT pair when 'pat' (the default), or the GitHub App pair when
      # 'github_app'. Neither can be declared required: true here — GitHub
      # Actions can't express "required unless X" — so the "Validate GitHub
      # authentication inputs" step enforces it at runtime instead.
      VULNHUNT_GITHUB_VERIFY_TOKEN:
        required: false
      VULNHUNT_GITHUB_REPORTS_TOKEN:
        required: false
      VULNHUNT_GITHUB_APP_ID:
        required: false
      VULNHUNT_GITHUB_APP_PRIVATE_KEY:
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: vulnhunter-verify-${{ inputs.expected_repository }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify VulnHunter findings
    # Mythos fails closed onto an ephemeral/self-hosted Linux runner that has
    # Docker's runsc runtime: python -m agent --mode=verify itself stays on
    # this runner (it needs a real GitHub credential to fetch issue evidence
    # and clone the target repo), but for claude-mythos-5 it shells out to
    # scripts/run_mythos_verify_sandbox.sh to run the model turn inside a
    # gVisor container — see agent/verify_mythos.py. Opus runs on an
    # ordinary runner, unchanged.
    runs-on: ${{ (inputs.model == 'claude-mythos-5') && (vars.VULNHUNT_VERIFY_GVISOR_RUNNER || 'gvisor') || (vars.VULNHUNT_VERIFY_RUNNER || 'ubuntu-latest') }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    environment: vulnhunter-verify
    outputs:
      disposition-count: ${{ steps.attest.outputs.disposition-count }}
      verdict-counts-json: ${{ steps.attest.outputs.verdict-counts-json }}

    steps:
      - name: Enforce trusted same-repository workflow invocation
        if: ${{ !startsWith(github.workflow_ref, format('{0}/', github.repository)) }}
        shell: bash
        run: |
          echo "Cross-repository workflow_call is not supported because this workflow executes local composite actions." >&2
          exit 64

      - name: Checkout trusted workflow repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Validate GitHub authentication inputs
        shell: bash
        env:
          AUTH_METHOD: ${{ inputs.github_auth_method }}
          APP_ID: ${{ secrets.VULNHUNT_GITHUB_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.VULNHUNT_GITHUB_APP_PRIVATE_KEY }}
          PAT_VERIFY: ${{ secrets.VULNHUNT_GITHUB_VERIFY_TOKEN }}
          PAT_REPORTS: ${{ secrets.VULNHUNT_GITHUB_REPORTS_TOKEN }}
        run: |
          set -euo pipefail
          case "${AUTH_METHOD}" in
            pat)
              [[ -n "${PAT_VERIFY}" && -n "${PAT_REPORTS}" ]] || {
                echo "::error::github_auth_method=pat requires the VULNHUNT_GITHUB_VERIFY_TOKEN and VULNHUNT_GITHUB_REPORTS_TOKEN secrets."
                exit 1
              }
              ;;
            github_app)
              [[ -n "${APP_ID}" && -n "${APP_PRIVATE_KEY}" ]] || {
                echo "::error::github_auth_method=github_app requires the VULNHUNT_GITHUB_APP_ID and VULNHUNT_GITHUB_APP_PRIVATE_KEY secrets."
                exit 1
              }
              ;;
            *)
              echo "::error::Unsupported github_auth_method '${AUTH_METHOD}'; use 'pat' or 'github_app'."
              exit 1
              ;;
          esac

      - name: Resolve GitHub App token scopes
        id: app-scope
        if: inputs.github_auth_method == 'github_app'
        shell: bash
        env:
          EXPECTED_REPOSITORY: ${{ inputs.expected_repository }}
          REPORTS_REPOSITORY: ${{ inputs.reports_repository }}
        run: |
          set -euo pipefail
          {
            echo "verify-owner=${EXPECTED_REPOSITORY%%/*}"
            echo "verify-repo=${EXPECTED_REPOSITORY#*/}"
            echo "reports-owner=${REPORTS_REPOSITORY%%/*}"
            echo "reports-repo=${REPORTS_REPOSITORY#*/}"
          } >> "${GITHUB_OUTPUT}"

      - name: Mint verify-scoped GitHub App installation token
        id: mint-verify-token
        if: inputs.github_auth_method == 'github_app'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.VULNHUNT_GITHUB_APP_ID }}
          private-key: ${{ secrets.VULNHUNT_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ steps.app-scope.outputs.verify-owner }}
          repositories: ${{ steps.app-scope.outputs.verify-repo }}

      - name: Mint reports-scoped GitHub App installation token
        id: mint-reports-token
        if: inputs.github_auth_method == 'github_app'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.VULNHUNT_GITHUB_APP_ID }}
          private-key: ${{ secrets.VULNHUNT_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ steps.app-scope.outputs.reports-owner }}
          repositories: ${{ steps.app-scope.outputs.reports-repo }}

      - name: Set up VulnHunter agent
        id: setup
        uses: ./.github/actions/setup-vulnhunter-agent
        with:
          python-version: "3.12"
          working-directory: vulnhunter-agent
          config-path: vulnhunter-agent/agent/config.example.toml
          install-skills: "true"

      - name: Validate issue provenance and batch scope
        id: prepare
        uses: ./.github/actions/prepare-vulnhunter-verify
        with:
          issue-urls-json: ${{ inputs.issue_urls_json }}
          trusted-issue-authors: ${{ vars.VULNHUNT_TRUSTED_ISSUE_AUTHORS }}
          expected-repository: ${{ inputs.expected_repository }}
          verify-token: ${{ inputs.github_auth_method == 'github_app' && steps.mint-verify-token.outputs.token || secrets.VULNHUNT_GITHUB_VERIFY_TOKEN }}
          github-server-url: ${{ github.server_url }}
          model: ${{ inputs.model }}
          mythos-retention-acknowledged: ${{ inputs.mythos_retention_acknowledged }}
          post-comments: ${{ inputs.post_comments }}
          reopen-nonfixed: ${{ inputs.reopen_nonfixed }}

      - name: Validate and attest Mythos gVisor isolation
        id: mythos-proof
        if: inputs.model == 'claude-mythos-5'
        shell: bash
        env:
          # Credential-free canary: proves the same runsc/read-only/tmpfs-only/
          # single-host-egress boundaries the real run will use, before any
          # model or GitHub credential is involved.
          MYTHOS_REPO_ROOT: ${{ github.workspace }}
          MYTHOS_DOCKER_RUNTIME: runsc
        run: |
          set -euo pipefail
          chmod +x scripts/validate_mythos_isolation.sh
          proof_log="${RUNNER_TEMP}/mythos-verify-isolation-proof-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.log"
          scripts/validate_mythos_isolation.sh | tee "${proof_log}"
          {
            echo "### Mythos gVisor isolation proof (verify)"
            echo
            echo '```text'
            grep '^ISOLATION_PROOF ' "${proof_log}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
          rm -f -- "${proof_log}"

      - name: Run fix verification
        id: verify
        continue-on-error: true
        uses: ./.github/actions/run-vulnhunter-verify
        with:
          python-path: ${{ steps.setup.outputs.python-path }}
          config-path: ${{ steps.setup.outputs.config-path }}
          github-host: ${{ steps.prepare.outputs.github-host }}
          issue-urls-json: ${{ steps.prepare.outputs.issue-urls-json }}
          model: ${{ inputs.model }}
          commit: ${{ inputs.commit }}
          post-comments: ${{ inputs.post_comments }}
          reopen-nonfixed: ${{ inputs.reopen_nonfixed }}
          reports-repository-url: ${{ github.server_url }}/${{ inputs.reports_repository }}
          reports-branch: ${{ inputs.reports_branch }}
          aws-workspace-id: ${{ secrets.ANTHROPIC_AWS_WORKSPACE_ID }}
          aws-api-key: ${{ secrets.ANTHROPIC_AWS_API_KEY }}
          verify-token: ${{ inputs.github_auth_method == 'github_app' && steps.mint-verify-token.outputs.token || secrets.VULNHUNT_GITHUB_VERIFY_TOKEN }}
          reports-token: ${{ inputs.github_auth_method == 'github_app' && steps.mint-reports-token.outputs.token || secrets.VULNHUNT_GITHUB_REPORTS_TOKEN }}

      - name: Attest verify disposition
        id: attest
        if: always() && steps.verify.outputs.disposition-path != ''
        continue-on-error: true
        uses: ./.github/actions/attest-vulnhunter-verify
        with:
          python-path: ${{ steps.setup.outputs.python-path }}
          schema-path: ${{ steps.setup.outputs.agent-directory }}/verify_disposition.schema.json
          run-directory: ${{ steps.verify.outputs.run-directory }}
          disposition-path: ${{ steps.verify.outputs.disposition-path }}
          agent-exit-code: ${{ steps.verify.outputs.agent-exit-code }}
          expected-count: ${{ steps.prepare.outputs.issue-count }}

      - name: Package curated verify evidence
        id: package
        if: always()
        continue-on-error: true
        uses: ./.github/actions/package-vulnhunter-run
        with:
          mode: verify
          run-directory: ${{ steps.verify.outputs.run-directory }}
          agent-exit-code: ${{ steps.verify.outputs.agent-exit-code || 'not-started' }}

      - name: Upload sensitive verify evidence
        id: upload
        if: always() && steps.package.outputs.package-directory != ''
        uses: actions/upload-artifact@v4
        with:
          name: vulnhunter-verify-${{ steps.prepare.outputs.target-key || github.run_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.package.outputs.package-directory }}
          if-no-files-found: error
          include-hidden-files: false
          retention-days: ${{ inputs.artifact_retention_days }}

      - name: Enforce verify workflow outcome
        if: always()
        shell: bash
        env:
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
          PREPARE_OUTCOME: ${{ steps.prepare.outcome }}
          MYTHOS_PROOF_OUTCOME: ${{ steps.mythos-proof.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          ATTEST_OUTCOME: ${{ steps.attest.outcome }}
          PACKAGE_OUTCOME: ${{ steps.package.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        run: |
          set -euo pipefail
          for outcome in "${SETUP_OUTCOME}" "${PREPARE_OUTCOME}" "${VERIFY_OUTCOME}" "${ATTEST_OUTCOME}" "${PACKAGE_OUTCOME}" "${UPLOAD_OUTCOME}"; do
            [[ "${outcome}" == "success" ]] || {
              echo "::error::VulnHunter verify did not complete every trusted workflow stage."
              exit 1
            }
          done
          # mythos-proof only runs for claude-mythos-5 (if: inputs.model ==
          # 'claude-mythos-5'); "skipped" is the correct, expected outcome for
          # every Opus run. Anything else (failure/cancelled) is fatal.
          [[ "${MYTHOS_PROOF_OUTCOME}" == "success" || "${MYTHOS_PROOF_OUTCOME}" == "skipped" ]] || {
            echo "::error::Mythos gVisor isolation proof did not pass."
            exit 1
          }
