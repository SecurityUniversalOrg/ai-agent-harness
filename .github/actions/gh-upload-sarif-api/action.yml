name: Upload SARIF by API
description: Uploads SARIF to a target repository using the GitHub code scanning SARIF API.

inputs:
  token:
    required: true

  owner:
    required: true

  repo:
    required: true

  ref:
    required: true

  commit-sha:
    required: true

  sarif-file:
    required: true

  github-api-url:
    required: false
    default: https://api.github.com

outputs:
  sarif-id:
    value: ${{ steps.upload.outputs.sarif-id }}

runs:
  using: composite
  steps:
    - name: Upload SARIF
      id: upload
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        OWNER: ${{ inputs.owner }}
        REPO: ${{ inputs.repo }}
        REF: ${{ inputs.ref }}
        COMMIT_SHA: ${{ inputs.commit-sha }}
        SARIF_FILE: ${{ inputs.sarif-file }}
        API_URL: ${{ inputs.github-api-url }}
      run: |
        set -euo pipefail

        if [ ! -f "$SARIF_FILE" ]; then
          echo "ERROR: SARIF file not found: $SARIF_FILE"
          exit 1
        fi

        jq . "$SARIF_FILE" >/dev/null

        gzip -c "$SARIF_FILE" | base64 -w0 > sarif.gz.b64

        jq -n \
          --arg commit_sha "$COMMIT_SHA" \
          --arg ref "$REF" \
          --rawfile sarif sarif.gz.b64 \
          '{
            commit_sha: $commit_sha,
            ref: $ref,
            sarif: $sarif
          }' > sarif-upload-payload.json

        http_code="$(
          curl -sS \
            -o sarif-upload-response.json \
            -w "%{http_code}" \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${API_URL}/repos/${OWNER}/${REPO}/code-scanning/sarifs" \
            --data @sarif-upload-payload.json
        )"

        if [ "$http_code" -lt 200 ] || [ "$http_code" -gt 299 ]; then
          echo "ERROR: SARIF upload failed with HTTP $http_code"
          cat sarif-upload-response.json
          exit 1
        fi

        SARIF_ID="$(jq -r '.id // empty' sarif-upload-response.json)"
        echo "sarif-id=${SARIF_ID}" >> "$GITHUB_OUTPUT"

        echo "SARIF upload accepted for ${OWNER}/${REPO}: ${SARIF_ID}"