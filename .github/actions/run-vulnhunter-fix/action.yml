name: Run VulnHunter Fix
description: Executes one contained automated fix run and preserves its exact process outcome.

inputs:
  python-path:
    required: true
  config-path:
    required: true
  target-url:
    required: true
  report-directory:
    required: true
  scratch-base:
    required: true
  model:
    description: "Model, or 'auto' to let config-driven remediation-tier selection choose per run (see remediation-model). Not 'auto'-compatible with claude-mythos-5, which always requires an explicit, retention-acknowledged choice."
    required: false
    default: claude-opus-4-8
  remediation-model:
    description: Cheaper model used when model=auto and report severity doesn't require escalation. Blank disables tiering even when model=auto (falls back to config.toml's anthropic.model).
    required: false
    default: ""
  remediation-escalate-severities:
    description: Comma-separated report severity tokens ("High+","High","Medium","Low","Informational") that force the escalated (scan-tier) model even when model=auto.
    required: false
    default: "High+"
  mythos-retention-acknowledged:
    required: false
    default: "false"
  anthropic-auth-mode:
    description: "'api_key' (Claude Platform on AWS workspace API key, default) or 'aws_role' (Bedrock, signed with AWS credentials already present in the job environment). Not supported for model=claude-mythos-5."
    required: false
    default: api_key
  aws-workspace-id:
    required: false
  aws-api-key:
    required: false
  aws-region:
    required: false
    default: us-east-1
  fix-token:
    required: true
  delivery-enabled:
    required: false
    default: "false"
  test-policy:
    required: false
    default: best-effort
  fork-org:
    required: false
    default: ""
  fork-prefix:
    required: false
    default: vulnhunter-fix
  base-branch:
    required: false
    default: main
  draft-pr:
    required: false
    default: "true"
  pr-labels:
    required: false
    default: security,vulnhunter-fix
  collaborators:
    required: false
    default: ""
  allowed-domains:
    required: false
    default: ""
  keep-workdir:
    required: false
    default: "true"

  github-host:
    description: GitHub hostname or hostname:port for agent URL and API policy.
    required: true
outputs:
  agent-exit-code:
    description: Exact exit code returned by python -m agent.
    value: ${{ steps.run-opus.outputs.agent-exit-code || steps.run-mythos.outputs.agent-exit-code }}
  run-directory:
    description: The single contained run directory, when one was created.
    value: ${{ steps.run-opus.outputs.run-directory || steps.run-mythos.outputs.run-directory }}
  disposition-path:
    description: Expected fix disposition path, when a run directory exists.
    value: ${{ steps.run-opus.outputs.disposition-path || steps.run-mythos.outputs.disposition-path }}

runs:
  using: composite
  steps:
    - name: Execute automated fork remediation
      id: run-opus
      if: inputs.model != 'claude-mythos-5'
      shell: bash
      env:
        PYTHON_PATH: ${{ inputs.python-path }}
        CONFIG_PATH: ${{ inputs.config-path }}
        TARGET_URL: ${{ inputs.target-url }}
        REPORT_DIRECTORY: ${{ inputs.report-directory }}
        SCRATCH_BASE: ${{ inputs.scratch-base }}
        MODEL: ${{ inputs.model }}
        DELIVERY_ENABLED: ${{ inputs.delivery-enabled }}
        TEST_POLICY: ${{ inputs.test-policy }}
        # aws_role mode signs Bedrock requests with whatever AWS credentials
        # are already present in this job's process environment (see the
        # calling workflow's "Assume AWS role for Claude on Bedrock" step, or
        # a self-hosted runner's instance/task role) — aws-workspace-id/
        # aws-api-key are unused and typically empty in that mode.
        VULNHUNT_ANTHROPIC_AUTH_MODE: ${{ inputs.anthropic-auth-mode == 'aws_role' && 'bedrock_sigv4' || 'anthropic_aws' }}
        VULNHUNT_ANTHROPIC_AWS_WORKSPACE_ID: ${{ inputs.aws-workspace-id }}
        VULNHUNT_ANTHROPIC_AWS_API_KEY: ${{ inputs.aws-api-key }}
        VULNHUNT_ANTHROPIC_AWS_REGION: ${{ inputs.aws-region }}
        VULNHUNT_ANTHROPIC_MODEL: ${{ inputs.model }}
        VULNHUNT_GITHUB_SCAN_TOKEN: ${{ inputs.fix-token }}
        VULNHUNT_GITHUB_HOST: ${{ inputs.github-host }}
        VULNHUNT_GITHUB_REPORTS_TOKEN: ""
        VULNHUNT_FIX_FORK_ORG: ${{ inputs.fork-org }}
        VULNHUNT_FIX_FORK_PREFIX: ${{ inputs.fork-prefix }}
        VULNHUNT_FIX_DEFAULT_BASE_BRANCH: ${{ inputs.base-branch }}
        VULNHUNT_FIX_PR_DRAFT: ${{ inputs.draft-pr }}
        VULNHUNT_FIX_PR_LABELS: ${{ inputs.pr-labels }}
        VULNHUNT_FIX_COLLABORATORS: ${{ inputs.collaborators }}
        VULNHUNT_FIX_ALLOWED_DOMAINS: ${{ inputs.allowed-domains }}
        VULNHUNT_FIX_KEEP_WORKDIR: ${{ inputs.keep-workdir }}
        VULNHUNT_FIX_TEST_POLICY: ${{ inputs.test-policy }}
        # Enterprise-program model tiering (docs/enterprise-program/02-reference-
        # architecture.md §2.3.2). Only takes effect when MODEL="auto" below
        # causes --model to be omitted; otherwise the explicit model wins.
        VULNHUNT_ANTHROPIC_REMEDIATION_MODEL: ${{ inputs.remediation-model }}
        VULNHUNT_ANTHROPIC_REMEDIATION_ESCALATE_SEVERITIES: ${{ inputs.remediation-escalate-severities }}
        VULNHUNT_SANDBOX_ENABLED: "true"
        VULNHUNT_SANDBOX_FAIL_IF_UNAVAILABLE: "true"
        VULNHUNT_SANDBOX_ALLOW_UNSANDBOXED_COMMANDS: "false"
        VULNHUNT_TELEMETRY_ENABLED: "false"
        PYTHONUNBUFFERED: "1"
      run: |
        set -euo pipefail

        [[ -z "${VULNHUNT_ANTHROPIC_AWS_WORKSPACE_ID}" ]] || echo "::add-mask::${VULNHUNT_ANTHROPIC_AWS_WORKSPACE_ID}"
        [[ -z "${VULNHUNT_ANTHROPIC_AWS_API_KEY}" ]] || echo "::add-mask::${VULNHUNT_ANTHROPIC_AWS_API_KEY}"
        echo "::add-mask::${VULNHUNT_GITHUB_SCAN_TOKEN}"
        [[ -x "${PYTHON_PATH}" && -f "${CONFIG_PATH}" && -d "${REPORT_DIRECTORY}" && -d "${SCRATCH_BASE}" ]] || {
          echo "::error::Fix execution received an invalid prepared path."
          exit 64
        }

        post_args=(--no-post)
        [[ "${DELIVERY_ENABLED}" == "true" ]] && post_args=()

        # model="auto" omits --model entirely so config-driven tiering
        # (VULNHUNT_ANTHROPIC_REMEDIATION_MODEL, set above) decides per run
        # instead of every fix always running at the scan-tier model.
        model_args=(--model "${MODEL}")
        [[ "${MODEL}" != "auto" ]] || model_args=()

        set +e
        "${PYTHON_PATH}" -m agent \
          --mode=fix \
          --config "${CONFIG_PATH}" \
          "${model_args[@]}" \
          --scratch-dir "${SCRATCH_BASE}" \
          --test-policy "${TEST_POLICY}" \
          "${post_args[@]}" \
          "${TARGET_URL}" \
          "${REPORT_DIRECTORY}"
        agent_rc=$?
        set -e

        mapfile -d '' run_dirs < <(find "${SCRATCH_BASE}" -mindepth 1 -maxdepth 1 -type d -print0)
        run_dir=""
        disposition=""
        if (( ${#run_dirs[@]} == 1 )); then
          run_dir="$(realpath -e "${run_dirs[0]}")"
          case "${run_dir}" in "$(realpath -e "${SCRATCH_BASE}")"/*) ;; *) echo "::error::Fix run escaped its scratch base."; exit 1 ;; esac
          disposition="${run_dir}/out/fix_disposition.json"
        elif (( ${#run_dirs[@]} > 1 )); then
          echo "::error::Fix execution created multiple run directories."
          agent_rc=1
        fi

        {
          echo "agent-exit-code=${agent_rc}"
          echo "run-directory=${run_dir}"
          echo "disposition-path=${disposition}"
        } >> "${GITHUB_OUTPUT}"
        exit "${agent_rc}"

    - name: Execute isolated Mythos fix run with gVisor
      id: run-mythos
      if: inputs.model == 'claude-mythos-5'
      shell: bash
      env:
        TARGET_REPOSITORY: ${{ inputs.target-url }}
        MYTHOS_REPORT_DIR: ${{ inputs.report-directory }}
        MYTHOS_SCRATCH_BASE: ${{ inputs.scratch-base }}
        MYTHOS_GITHUB_HOST: ${{ inputs.github-host }}
        MYTHOS_REPO_ROOT: ${{ github.workspace }}
        MYTHOS_RETENTION_ACKNOWLEDGED: ${{ inputs.mythos-retention-acknowledged }}
        MYTHOS_TEST_POLICY: ${{ inputs.test-policy }}
        MYTHOS_DOCKER_RUNTIME: runsc
        VULNHUNT_ANTHROPIC_AWS_WORKSPACE_ID: ${{ inputs.aws-workspace-id }}
        VULNHUNT_ANTHROPIC_AWS_API_KEY: ${{ inputs.aws-api-key }}
        # This token exists only in this trusted control-plane process, used
        # solely to clone the target before the gVisor container starts. The
        # launcher never writes it into the agent env-file or the container.
        VULNHUNT_GITHUB_FIX_TOKEN: ${{ inputs.fix-token }}
      run: |
        set -euo pipefail
        echo "::add-mask::${VULNHUNT_ANTHROPIC_AWS_WORKSPACE_ID}"
        echo "::add-mask::${VULNHUNT_ANTHROPIC_AWS_API_KEY}"
        echo "::add-mask::${VULNHUNT_GITHUB_FIX_TOKEN}"
        [[ "${{ inputs.delivery-enabled }}" == "false" ]] || {
          echo "::error::claude-mythos-5 fix mode is local-dry-run only; delivery-enabled must be false."
          exit 1
        }
        chmod +x "${GITHUB_ACTION_PATH}/../../../scripts/run_mythos_fix_sandbox.sh"
        "${GITHUB_ACTION_PATH}/../../../scripts/run_mythos_fix_sandbox.sh"
