name: Create Central Report PR
description: Creates a branch and pull request with updated central reporting files.

inputs:
  token:
    required: true

  central-repo-path:
    required: true

  branch-prefix:
    required: false
    default: ai-security-triage

  commit-message:
    required: false
    default: Update AI security triage reports

  pr-title:
    required: false
    default: Update AI security triage reports

  pr-body:
    required: false
    default: Updates AI security triage reports.

runs:
  using: composite
  steps:
    - name: Create branch, commit, and PR
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        CENTRAL_REPO: ${{ inputs.central-repo-path }}
        BRANCH_PREFIX: ${{ inputs.branch-prefix }}
        COMMIT_MESSAGE: ${{ inputs.commit-message }}
        PR_TITLE: ${{ inputs.pr-title }}
        PR_BODY: ${{ inputs.pr-body }}
      run: |
        set -euo pipefail

        cd "$CENTRAL_REPO"

        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        echo "Current repo status before staging:"
        git status --short

        BRANCH="${BRANCH_PREFIX}/$(date -u +"%Y%m%d%H%M%S")"

        git checkout -b "$BRANCH"

        # Stage both tracked changes and new untracked report files.
        git add org_findings.csv reports/

        echo "Current repo status after staging:"
        git status --short

        # This detects staged tracked changes AND newly added files.
        if git diff --cached --quiet; then
          echo "No report changes detected after staging. Skipping PR."
          exit 0
        fi

        git commit -m "$COMMIT_MESSAGE"
        git push origin "$BRANCH"

        BASE_BRANCH="$(git remote show origin | sed -n '/HEAD branch/s/.*: //p')"

        if [ -z "$BASE_BRANCH" ]; then
          BASE_BRANCH="$(git branch --show-current)"
        fi

        gh pr create \
          --title "$PR_TITLE" \
          --body "$PR_BODY" \
          --base "$BASE_BRANCH" \
          --head "$BRANCH"