name: Claude Agent Security Scan
description: Runs VulnHunter using Claude Platform on AWS and scoped GitHub credentials
author: Your Organization

inputs:
  aws-workspace-id:
    description: Claude Platform on AWS workspace ID
    required: true

  aws-api-key:
    description: Claude Platform on AWS workspace API key
    required: true

  scan-token:
    description: GitHub token used to clone target repositories and manage findings
    required: true

  reports-token:
    description: GitHub token used to read and publish VulnHunter reports
    required: false

  github-auth-method:
    description: >
      How scan-token/reports-token were obtained: 'pat' (static secret, the
      default) or 'github_app' (minted installation token). Mythos re-mints
      fresh scan/reports tokens immediately before "Deliver Mythos results"
      only when this is 'github_app' — GitHub App installation tokens are
      hard-capped at 1 hour by GitHub's API, and the preceding gVisor scan
      step can run far longer than that. 'pat' tokens are unaffected: they
      don't expire on a fixed short window, so no refresh is attempted.
    required: false
    default: pat

  app-id:
    description: GitHub App ID (or client ID), required when github-auth-method=github_app
    required: false
    default: ""

  app-private-key:
    description: GitHub App private key (PEM), required when github-auth-method=github_app
    required: false
    default: ""

  publish-results:
    description: Publish the report to the central reports repository
    required: false
    default: "true"

  submit-repo-issues:
    description: Create or update findings issues in the scanned repository
    required: false
    default: "true"

  reports-repository-url:
    description: Central reports repository URL (defaults to the calling workflow repository)
    required: false
    default: ""

  reports-branch:
    description: Branch used in the central reports repository
    required: false
    default: main

  model:
    description: Reviewed model ID (claude-opus-4-7, claude-opus-4-8, or claude-mythos-5)
    required: false
    default: claude-opus-4-8

  mythos-retention-acknowledged:
    description: Explicit acknowledgement that Mythos requests have mandatory 30-day retention
    required: false
    default: "false"

  repository-url:
    description: GitHub repository URL to scan
    required: true

  repository-branch:
    description: Explicit target branch to scan (empty uses the repository default)
    required: false
    default: ""

  python-version:
    description: Python version used to execute the agent
    required: false
    default: "3.12"

  working-directory:
    description: Directory containing the Python agent module
    required: false
    default: "./vulnhunter-agent"

runs:
  using: composite

  steps:
    - name: Set up Python
      if: inputs.model != 'claude-mythos-5' || inputs.publish-results == 'true' || inputs.submit-repo-issues == 'true'
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}

    - name: Validate configuration
      shell: bash
      env:
        AWS_WORKSPACE_ID: ${{ inputs.aws-workspace-id }}
        AWS_API_KEY: ${{ inputs.aws-api-key }}
        SCAN_TOKEN: ${{ inputs.scan-token }}
        REPORTS_TOKEN: ${{ inputs.reports-token }}
        TARGET_REPOSITORY: ${{ inputs.repository-url }}
        TARGET_BRANCH: ${{ inputs.repository-branch }}
        MODEL: ${{ inputs.model }}
        MYTHOS_RETENTION_ACKNOWLEDGED: ${{ inputs.mythos-retention-acknowledged }}
        PUBLISH_RESULTS: ${{ inputs.publish-results }}
        SUBMIT_REPO_ISSUES: ${{ inputs.submit-repo-issues }}
        REPORTS_REPOSITORY_URL: ${{ inputs.reports-repository-url || format('{0}/{1}', github.server_url, github.repository) }}
        REPORTS_BRANCH: ${{ inputs.reports-branch }}
        AUTH_METHOD: ${{ inputs.github-auth-method }}
        APP_ID: ${{ inputs.app-id }}
        APP_PRIVATE_KEY: ${{ inputs.app-private-key }}
      run: |
        set -euo pipefail

        declare -A required_values=(
          [aws-workspace-id]="${AWS_WORKSPACE_ID}"
          [aws-api-key]="${AWS_API_KEY}"
          [scan-token]="${SCAN_TOKEN}"
        )

        for input_name in "${!required_values[@]}"; do
          value="${required_values[$input_name]}"
          if [[ -z "${value}" ]]; then
            echo "::error::The ${input_name} input is required."
            exit 1
          fi
          if [[ "${value}" == *$'\n'* || "${value}" == *$'\r'* ]]; then
            echo "::error::The ${input_name} input must be a single line."
            exit 1
          fi
          echo "::add-mask::${value}"
        done

        if [[ -z "${TARGET_REPOSITORY}" ]]; then
          echo "::error::The repository-url input is required."
          exit 1
        fi
        if [[ -n "${TARGET_BRANCH}" ]]; then
          if [[ ! "${TARGET_BRANCH}" =~ ^[A-Za-z0-9._/-]+$ || "${TARGET_BRANCH}" == -* ]] \
              || ! git check-ref-format --branch "${TARGET_BRANCH}" >/dev/null 2>&1; then
            echo "::error::repository-branch is not a safe Git branch name."
            exit 1
          fi
        fi

        case "${MODEL}" in
          claude-opus-4-7|claude-opus-4-8|claude-mythos-5) ;;
          *)
            echo "::error::Unsupported model '${MODEL}'. Use claude-opus-4-7, claude-opus-4-8, or claude-mythos-5."
            exit 1
            ;;
        esac

        for toggle_name in PUBLISH_RESULTS SUBMIT_REPO_ISSUES; do
          toggle_value="${!toggle_name}"
          if [[ "${toggle_value}" != "true" && "${toggle_value}" != "false" ]]; then
            echo "::error::${toggle_name} must be exactly 'true' or 'false'; got '${toggle_value}'."
            exit 1
          fi
        done

        if [[ -n "${REPORTS_TOKEN}" ]]; then
          if [[ "${REPORTS_TOKEN}" == *$'\n'* || "${REPORTS_TOKEN}" == *$'\r'* ]]; then
            echo "::error::The reports-token input must be a single line."
            exit 1
          fi
          echo "::add-mask::${REPORTS_TOKEN}"
        fi

        if [[ "${PUBLISH_RESULTS}" == "true" ]]; then
          if [[ -z "${REPORTS_TOKEN}" ]]; then
            echo "::error::reports-token is required when publish-results=true."
            exit 1
          fi
          if [[ -z "${REPORTS_REPOSITORY_URL}" ]]; then
            echo "::error::reports-repository-url is required when publish-results=true."
            exit 1
          fi
          if [[ "${REPORTS_REPOSITORY_URL}" == *$'\n'* || "${REPORTS_REPOSITORY_URL}" == *$'\r'* ]]; then
            echo "::error::reports-repository-url must be a single line."
            exit 1
          fi
          if ! git check-ref-format --branch "${REPORTS_BRANCH}" >/dev/null 2>&1; then
            echo "::error::reports-branch is not a valid Git branch name."
            exit 1
          fi
        fi

        if [[ "${MODEL}" == "claude-mythos-5" ]]; then
          if [[ "${MYTHOS_RETENTION_ACKNOWLEDGED}" != "true" ]]; then
            echo "::error::Mythos requires mythos-retention-acknowledged=true (mandatory 30-day retention; no ZDR)."
            exit 1
          fi
        fi

        case "${AUTH_METHOD}" in
          pat) ;;
          github_app)
            if [[ -z "${APP_ID}" || -z "${APP_PRIVATE_KEY}" ]]; then
              echo "::error::github-auth-method=github_app requires the app-id and app-private-key inputs."
              exit 1
            fi
            ;;
          *)
            echo "::error::Unsupported github-auth-method '${AUTH_METHOD}'; use 'pat' or 'github_app'."
            exit 1
            ;;
        esac

        echo "Delivery configuration: publish-results=${PUBLISH_RESULTS}, submit-repo-issues=${SUBMIT_REPO_ISSUES}"
        echo "Target branch: ${TARGET_BRANCH:-<repository default>}"
        if [[ "${PUBLISH_RESULTS}" == "true" ]]; then
          echo "Central reports destination is configured on branch ${REPORTS_BRANCH}."
        fi


    - name: Run Opus Claude Platform on AWS agent scan
      if: inputs.model != 'claude-mythos-5'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        # These environment overlays take precedence over agent/config.toml.
        # Keep secrets process-scoped rather than writing them to the checkout.
        VULNHUNT_ANTHROPIC_AUTH_MODE: anthropic_aws
        VULNHUNT_ANTHROPIC_AWS_WORKSPACE_ID: ${{ inputs.aws-workspace-id }}
        VULNHUNT_ANTHROPIC_AWS_API_KEY: ${{ inputs.aws-api-key }}
        VULNHUNT_ANTHROPIC_MODEL: ${{ inputs.model }}
        VULNHUNT_GITHUB_SCAN_TOKEN: ${{ inputs.scan-token }}
        VULNHUNT_GITHUB_REPORTS_TOKEN: ${{ inputs.reports-token }}
        VULNHUNT_PUBLISH_ENABLED: ${{ inputs.publish-results }}
        VULNHUNT_PUBLISH_DESTINATION_REPO: ${{ inputs.reports-repository-url || format('{0}/{1}', github.server_url, github.repository) }}
        VULNHUNT_PUBLISH_BRANCH: ${{ inputs.reports-branch }}
        VULNHUNT_ISSUES_ENABLED: ${{ inputs.submit-repo-issues }}
        PUBLISH_RESULTS: ${{ inputs.publish-results }}
        SUBMIT_REPO_ISSUES: ${{ inputs.submit-repo-issues }}
        TARGET_REPOSITORY: ${{ inputs.repository-url }}
        TARGET_BRANCH: ${{ inputs.repository-branch }}
        PYTHONUNBUFFERED: "1"
      run: |
        set -euo pipefail

        echo "Setting up Environment via .venv"
        cp agent/config.example.toml agent/config.toml

        python3 -m venv .venv
        source .venv/bin/activate

        python3 -m pip install -e ".[dev]"

        echo "Scanning repository: ${TARGET_REPOSITORY}"
        branch_args=()
        if [[ -n "${TARGET_BRANCH}" ]]; then
          branch_args=(--branch "${TARGET_BRANCH}")
        fi
        publish_arg="--no-publish"
        issues_arg="--no-issues"
        [[ "${PUBLISH_RESULTS}" == "true" ]] && publish_arg="--publish"
        [[ "${SUBMIT_REPO_ISSUES}" == "true" ]] && issues_arg="--issues"
        python3 -m agent \
          --mode=scan \
          --model "${VULNHUNT_ANTHROPIC_MODEL}" \
          --config agent/config.toml \
          "${branch_args[@]}" \
          "${publish_arg}" \
          "${issues_arg}" \
          "${TARGET_REPOSITORY}"

    - name: Validate and attest Mythos gVisor isolation
      if: inputs.model == 'claude-mythos-5'
      shell: bash
      env:
        # This credential-free canary prints selected, non-secret attestations
        # and proves filesystem/network denial before any model is started.
        MYTHOS_REPO_ROOT: ${{ github.workspace }}
        MYTHOS_DOCKER_RUNTIME: runsc
      run: |
        set -euo pipefail
        chmod +x "${GITHUB_ACTION_PATH}/../../../scripts/validate_mythos_isolation.sh"
        proof_log="${RUNNER_TEMP}/mythos-isolation-proof-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.log"
        "${GITHUB_ACTION_PATH}/../../../scripts/validate_mythos_isolation.sh" | tee "${proof_log}"

        {
          echo "### Mythos gVisor isolation proof"
          echo
          echo '```text'
          grep '^ISOLATION_PROOF ' "${proof_log}"
          echo '```'
        } >> "${GITHUB_STEP_SUMMARY}"
        rm -f -- "${proof_log}"

    - name: Run isolated Mythos scan with gVisor
      id: mythos_scan
      if: inputs.model == 'claude-mythos-5'
      shell: bash
      env:
        TARGET_REPOSITORY: ${{ inputs.repository-url }}
        TARGET_BRANCH: ${{ inputs.repository-branch }}
        VULNHUNT_ANTHROPIC_AWS_WORKSPACE_ID: ${{ inputs.aws-workspace-id }}
        VULNHUNT_ANTHROPIC_AWS_API_KEY: ${{ inputs.aws-api-key }}
        # This token exists only in the trusted control-plane process. The
        # launcher never writes it to the agent env-file or model container.
        VULNHUNT_GITHUB_SCAN_TOKEN: ${{ inputs.scan-token }}
        MYTHOS_RETENTION_ACKNOWLEDGED: ${{ inputs.mythos-retention-acknowledged }}
        MYTHOS_REPO_ROOT: ${{ github.workspace }}
        MYTHOS_OUTPUT_DIR: ${{ github.workspace }}/${{ inputs.working-directory }}/clones
        MYTHOS_DOCKER_RUNTIME: runsc
      run: |
        set -euo pipefail
        chmod +x "${GITHUB_ACTION_PATH}/../../../scripts/run_mythos_sandbox.sh"
        "${GITHUB_ACTION_PATH}/../../../scripts/run_mythos_sandbox.sh"

    # GitHub App installation tokens are hard-capped at 1 hour by GitHub's API
    # (there is no way to mint a longer-lived one) and the preceding gVisor
    # scan can run far longer than that. The scan-token/reports-token minted
    # by the calling workflow before this composite action started are
    # therefore likely expired by the time delivery runs. Re-mint fresh ones
    # right before they're used, scoped identically to how the calling
    # workflow scoped the originals — never wider. 'pat' tokens don't expire
    # on a fixed short window, so this is skipped entirely for that method.
    - name: Resolve GitHub App token scopes for delivery
      id: delivery-app-scope
      if: inputs.model == 'claude-mythos-5' && inputs.github-auth-method == 'github_app' && (inputs.publish-results == 'true' || inputs.submit-repo-issues == 'true')
      shell: bash
      env:
        TARGET_REPOSITORY_URL: ${{ inputs.repository-url }}
        REPORTS_REPOSITORY_URL: ${{ inputs.reports-repository-url || format('{0}/{1}', github.server_url, github.repository) }}
      run: |
        set -euo pipefail
        # Both URLs are scheme://host/owner/repo; strip scheme and host.
        target_path="${TARGET_REPOSITORY_URL#*://}"
        target_path="${target_path#*/}"
        reports_path="${REPORTS_REPOSITORY_URL#*://}"
        reports_path="${reports_path#*/}"
        {
          echo "target-owner=${target_path%%/*}"
          echo "target-repo=${target_path#*/}"
          echo "reports-owner=${reports_path%%/*}"
          echo "reports-repo=${reports_path#*/}"
        } >> "${GITHUB_OUTPUT}"

    - name: Refresh scan-scoped GitHub App installation token
      id: refresh-scan-token
      if: inputs.model == 'claude-mythos-5' && inputs.github-auth-method == 'github_app' && inputs.submit-repo-issues == 'true'
      uses: actions/create-github-app-token@v2
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.app-private-key }}
        owner: ${{ steps.delivery-app-scope.outputs.target-owner }}
        repositories: ${{ steps.delivery-app-scope.outputs.target-repo }}

    - name: Refresh reports-scoped GitHub App installation token
      id: refresh-reports-token
      if: inputs.model == 'claude-mythos-5' && inputs.github-auth-method == 'github_app' && inputs.publish-results == 'true'
      uses: actions/create-github-app-token@v2
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.app-private-key }}
        owner: ${{ steps.delivery-app-scope.outputs.reports-owner }}
        repositories: ${{ steps.delivery-app-scope.outputs.reports-repo }}

    - name: Deliver Mythos results
      if: inputs.model == 'claude-mythos-5' && (inputs.publish-results == 'true' || inputs.submit-repo-issues == 'true')
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        # This trusted post-sandbox process is deliberately separate from the
        # Mythos container. Neither GitHub credential is present in that
        # container, its env-file, or its Docker inspect metadata.
        VULNHUNT_ANTHROPIC_AUTH_MODE: anthropic_aws
        VULNHUNT_ANTHROPIC_AWS_WORKSPACE_ID: ${{ inputs.aws-workspace-id }}
        VULNHUNT_ANTHROPIC_AWS_API_KEY: ${{ inputs.aws-api-key }}
        VULNHUNT_ANTHROPIC_AWS_REGION: us-east-1
        VULNHUNT_ANTHROPIC_MODEL: claude-opus-4-8
        VULNHUNT_GITHUB_SCAN_TOKEN: ${{ (inputs.github-auth-method == 'github_app' && steps.refresh-scan-token.outputs.token) || inputs.scan-token }}
        VULNHUNT_GITHUB_REPORTS_TOKEN: ${{ (inputs.github-auth-method == 'github_app' && steps.refresh-reports-token.outputs.token) || inputs.reports-token }}
        VULNHUNT_PUBLISH_ENABLED: ${{ inputs.publish-results }}
        VULNHUNT_PUBLISH_DESTINATION_REPO: ${{ inputs.reports-repository-url || format('{0}/{1}', github.server_url, github.repository) }}
        VULNHUNT_PUBLISH_BRANCH: ${{ inputs.reports-branch }}
        VULNHUNT_ISSUES_ENABLED: ${{ inputs.submit-repo-issues }}
        VULNHUNT_AUDIT_ENABLED: "false"
        PUBLISH_RESULTS: ${{ inputs.publish-results }}
        SUBMIT_REPO_ISSUES: ${{ inputs.submit-repo-issues }}
        TARGET_REPOSITORY: ${{ inputs.repository-url }}
        RESULTS_DIR: ${{ steps.mythos_scan.outputs.results_dir }}
        SOURCE_COMMIT: ${{ steps.mythos_scan.outputs.source_commit }}
        PYTHONUNBUFFERED: "1"
      run: |
        set -euo pipefail

        [[ -n "${RESULTS_DIR}" && -d "${RESULTS_DIR}" ]] || {
          echo "::error::The Mythos scan did not export a deliverable results directory."
          exit 1
        }
        [[ -f "${RESULTS_DIR}/README.md" && ! -L "${RESULTS_DIR}/README.md" ]] || {
          echo "::error::The Mythos scan exported an incomplete report: a regular, non-symlink top-level README.md is required."
          exit 1
        }
        [[ "${SOURCE_COMMIT}" =~ ^[0-9a-fA-F]{7,64}$ ]] || {
          echo "::error::The Mythos scan did not emit a valid source commit."
          exit 1
        }

        python3 -m venv .delivery-venv
        source .delivery-venv/bin/activate
        python3 -m pip install -e "."

        publish_arg="--no-publish"
        issues_arg="--no-issues"
        [[ "${PUBLISH_RESULTS}" == "true" ]] && publish_arg="--publish"
        [[ "${SUBMIT_REPO_ISSUES}" == "true" ]] && issues_arg="--issues"

        python3 -m agent \
          --mode=scan \
          --model claude-opus-4-8 \
          --config agent/config.example.toml \
          --no-scan \
          --results-dir "${RESULTS_DIR}" \
          --source-commit "${SOURCE_COMMIT}" \
          "${publish_arg}" \
          "${issues_arg}" \
          --issues-target-repo "${TARGET_REPOSITORY}" \
          "${TARGET_REPOSITORY}"
