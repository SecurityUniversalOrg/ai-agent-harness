name: Create Mitigation Issue
description: Creates a GitHub issue in the scanned repository from the mitigation report.

inputs:
  token:
    required: true

  owner:
    required: true

  repo:
    required: true

  title-prefix:
    required: false
    default: AI-assisted security triage

  mitigation-report-file:
    required: true

  ai-triage-file:
    required: true

  github-api-url:
    required: false
    default: https://api.github.com

outputs:
  issue-url:
    value: ${{ steps.issue.outputs.issue-url }}

  issue-number:
    value: ${{ steps.issue.outputs.issue-number }}

runs:
  using: composite
  steps:
    - name: Create issue
      id: issue
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        OWNER: ${{ inputs.owner }}
        REPO: ${{ inputs.repo }}
        TITLE_PREFIX: ${{ inputs.title-prefix }}
        MITIGATION_FILE: ${{ inputs.mitigation-report-file }}
        TRIAGE_FILE: ${{ inputs.ai-triage-file }}
        API_URL: ${{ inputs.github-api-url }}
      run: |
        set -euo pipefail

        if [ ! -f "$MITIGATION_FILE" ]; then
          echo "ERROR: Mitigation report not found: $MITIGATION_FILE"
          exit 1
        fi

        if [ ! -f "$TRIAGE_FILE" ]; then
          echo "ERROR: AI triage file not found: $TRIAGE_FILE"
          exit 1
        fi

        CRITICAL="$(jq -r '.opa_decision_inputs.critical_count // 0' "$TRIAGE_FILE")"
        HIGH="$(jq -r '.opa_decision_inputs.high_count // 0' "$TRIAGE_FILE")"
        BLOCK="$(jq -r '.opa_decision_inputs.block_release // false' "$TRIAGE_FILE")"

        TITLE="${TITLE_PREFIX}: ${CRITICAL} critical / ${HIGH} high findings"

        {
          echo "<!-- ai-security-triage:${OWNER}/${REPO} -->"
          echo ""
          echo "Repository: \`${OWNER}/${REPO}\`"
          echo ""
          echo "Release blocking: \`${BLOCK}\`"
          echo ""
          cat "$MITIGATION_FILE"
        } > issue-body.md

        jq -n \
          --arg title "$TITLE" \
          --rawfile body issue-body.md \
          '{
            title: $title,
            body: $body,
            labels: ["security", "ai-triage", "needs-remediation"]
          }' > issue-payload.json

        http_code="$(
          curl -sS \
            -o issue-response.json \
            -w "%{http_code}" \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${API_URL}/repos/${OWNER}/${REPO}/issues" \
            --data @issue-payload.json
        )"

        if [ "$http_code" -lt 200 ] || [ "$http_code" -gt 299 ]; then
          echo "ERROR: Issue creation failed with HTTP $http_code"
          cat issue-response.json
          exit 1
        fi

        ISSUE_URL="$(jq -r '.html_url' issue-response.json)"
        ISSUE_NUMBER="$(jq -r '.number' issue-response.json)"

        echo "issue-url=${ISSUE_URL}" >> "$GITHUB_OUTPUT"
        echo "issue-number=${ISSUE_NUMBER}" >> "$GITHUB_OUTPUT"